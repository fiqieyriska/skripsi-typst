name: Build Skripsi PDF

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: latest

      - name: Compile PDF
        run: typst compile main.typ skripsi-hasil.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skripsi-pdf
          path: skripsi-hasil.pdf
